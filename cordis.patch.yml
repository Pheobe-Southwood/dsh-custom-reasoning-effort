# The dsh-custom-reasoning-effort bundle patch: two rows, applied when a profile
# lists this package in its `dsh.profile.bundles`.
#
# `dsh plugin --profile <name> add` maintains that list automatically (the
# reconcile step in the dsh CLI appends every dependency declaring
# `dsh.bundle`), so this file is the only wiring an installation needs — users
# never hand-edit their profile's cordis.patch.yml for this plugin.
#
#   - custom-reasoning-effort  the settings normalizer: it fills the per-model
#                              reasoningEfforts of custom-provider routes so the
#                              official 推理等级 picker appears.
#   - effort-memory            the effort memory: it remembers the level last
#                              actually in effect per (provider, model) route
#                              and re-issues one selection when a session
#                              switches back to that model.
#
# WHY the second component is a SEPARATE ROW of a SEPARATE PACKAGE rather than a
# second module of this one:
#   - a row's `name` must be a bare package name. A subpath specifier (one
#     containing `/`) is not a package to DSH: `barePackageName()` returns
#     undefined for it, `readPluginMeta()` therefore builds no panel metadata,
#     and the row appears as an unnamed component in the plugin panel;
#   - pointing both rows at THIS package would give two rows the same module
#     source, which DSH rejects (resolves from multiple Loader sources).
# So the memory ships as the in-package sub-package `effort-memory/`:
#
#   effort-memory/                      sub-package dsh-effort-memory (host-only
#                                       entry index.js + locale metadata). It is
#                                       NOT declared in `dependencies` and is
#                                       NOT a bundle of its own — this file is
#                                       the only place its row is declared.
#   node_modules/dsh-effort-memory      -> <package root>/effort-memory, created
#                                       inside the installed package by the root
#                                       postinstall (scripts/link-effort-memory-package.mjs)
#   package.json                        keeps `"dsh-effort-memory":
#                                       "file:./effort-memory"` in
#                                       PEERdependencies. pnpm installs no peer,
#                                       but DSH's dependencyClosure walks
#                                       `dependencies` + `peerDependencies`, and
#                                       without the declaration the link can be
#                                       present while the row still fails to
#                                       import. It must not move to
#                                       `dependencies`: pnpm resolves a `file:`
#                                       spec against the PROFILE directory and
#                                       the whole install fails.
#
# Two parity rules keep each mount honest, both guarded by `test/mount-check.mjs`
# and `test/packaging.test.mjs`:
#   - each row's `name` must be the name of the package that ships its code, so
#     the Loader resolves the row from the profile's node_modules (for the
#     sub-package: from this package's own node_modules, see above);
#   - each row's `id` must equal the `name` the mounted host half exports
#     (`lib/index.js`, `effort-memory/index.js`), so the row and the plugin are
#     recognizably the same thing.
#
# Both rows must stay single entries: the include inserts rows verbatim and the
# Loader rejects a repeated entry id (`duplicate loader entry id`), so a
# hand-written copy of either row left in the profile patch layer is a boot
# failure, not a harmless duplicate. The same rule makes the standalone
# dsh-effort-memory bundle mutually exclusive with this package — it declares
# the very same `effort-memory` id, so a profile that lists both cannot boot.
#
# Neither component publishes a service (the normalizer only writes the
# persisted settings the `llm-pi-ai` adapter already reads; the memory only
# re-issues a selection through the public session command face), so both sit
# loose in the host root realm — no `isolate` realm is needed here.
#
# The normalizer's `config` block is its own marker slot, and it is deliberately
# empty: `residualInputsReclaimed` is written into it, on first run, by the
# one-shot cleanup of the `input` lists the 0.2.x releases of this plugin left
# in the profile's `llm-pi-ai` section. Keeping the block here is what makes the
# row configurable — a Loader entry with no `config` has no settings namespace
# to write to — and keeping its one field volatile is what lets the cleanup
# persist through the settings seam. Deleting the field by hand re-runs the
# cleanup once on the next start; see the README's upgrade section.
#
# The memory row carries no `config` block, and needs none: it persists nothing
# through the settings seam (its state is the storage domain `effort_memory`),
# so it has no marker to keep.

- insert:
    - id: custom-reasoning-effort
      name: dsh-custom-reasoning-effort
      config: {}

    - id: effort-memory
      name: dsh-effort-memory
